<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="1000" height="360" rx="14" fill="#14161b"/>

  <text x="60" y="80" fill="#ffffff" font-size="34" font-weight="700">PHP2Shell · CVE-2026-109618 / 109619</text>
  <text x="60" y="114" fill="#9aa3b2" font-size="17">out of memory before your code runs, then a destructor nobody set</text>

  <!-- hash table buckets -->
  <g font-size="15">
    <text x="60" y="176" fill="#9aa3b2">$_POST buckets</text>
    <g fill="#4ec27a">
      <rect x="230" y="156" width="90" height="30" rx="4"/>
      <rect x="326" y="156" width="90" height="30" rx="4"/>
      <rect x="422" y="156" width="90" height="30" rx="4"/>
    </g>
    <rect x="518" y="156" width="90" height="30" rx="4" fill="none" stroke="#ff7a59" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="563" y="176" fill="#ff7a59" text-anchor="middle">???</text>
    <path d="M608 171 H660" stroke="#ff7a59" stroke-width="2"/>
    <path d="M652 165 L662 171 L652 177" fill="none" stroke="#ff7a59" stroke-width="2"/>
    <text x="672" y="176" fill="#ff7a59">dtor() → system()</text>
    <text x="371" y="212" fill="#4ec27a" text-anchor="middle">valid entries</text>
    <text x="563" y="212" fill="#ff7a59" text-anchor="middle">nNumUsed++ then OOM</text>
  </g>

  <g font-size="16">
    <text x="60" y="270" fill="#9aa3b2">reached via</text>
    <text x="230" y="270" fill="#ffffff">any PHP URL · mod_php / FPM / CGI</text>
    <text x="60" y="304" fill="#9aa3b2">fixed in</text>
    <text x="230" y="304" fill="#febc2e">PHP 8.5.12 / 8.4.27 / 8.3.36 / 8.2.35</text>
  </g>

  <!-- elephant-ish badge -->
  <g transform="translate(860 40)">
    <ellipse cx="40" cy="34" rx="44" ry="26" fill="#777bb3"/>
    <text x="40" y="42" fill="#14161b" font-size="22" font-weight="700" text-anchor="middle">php</text>
  </g>
</svg>
