<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="Atkinson Hyperlegible Next, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="78%" cy="50%" r="45%">
      <stop offset="0" stop-color="#5b9cf5" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5b9cf5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#343946"/>
    </pattern>
  </defs>
  <rect width="1000" height="360" rx="14" fill="#14161b"/>
  <rect x="560" y="0" width="440" height="360" fill="url(#grid)" opacity="0.6"/>
  <rect width="1000" height="360" rx="14" fill="url(#glow)"/>

  <!-- kicker / category -->
  <text x="60" y="92" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#5b9cf5" letter-spacing="2">CATEGORY · TOPIC</text>
  <!-- title: max ~6 words, split over two lines if needed -->
  <text x="60" y="148" font-size="44" font-weight="700" fill="#ffffff">Short punchy title</text>
  <text x="60" y="200" font-size="44" font-weight="700" fill="#ffffff">on two lines</text>
  <text x="60" y="244" font-size="19" fill="#9aa3b2">One-line subtitle that says what you'll learn</text>
  <!-- optional takeaway chip -->
  <rect x="60" y="276" width="250" height="38" rx="19" fill="#262a33" stroke="#343946"/>
  <text x="80" y="301" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#febc2e">key setting › value</text>

  <!-- MOTIF (right ~40%): replace with a big icon composition about the topic -->
  <g transform="translate(700 70)" fill="none" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="0" y="40" width="120" height="150" rx="14" stroke="#9aa3b2"/>
    <line x1="22" y1="80" x2="98" y2="80" stroke="#343946"/>
    <line x1="22" y1="110" x2="98" y2="110" stroke="#343946"/>
    <circle cx="96" cy="160" r="6" fill="#4ec27a" stroke="none"/>
    <path d="M120 115 H190" stroke="#5b9cf5" stroke-dasharray="8 8"/>
    <circle cx="230" cy="115" r="40" stroke="#5b9cf5"/>
  </g>
</svg>
