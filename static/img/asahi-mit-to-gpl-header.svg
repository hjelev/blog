<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="1000" height="360" rx="14" fill="#14161b"/>

  <text x="60" y="80" fill="#ffffff" font-size="34" font-weight="700">Asahi Linux: MIT → GPL</text>
  <text x="60" y="114" fill="#9aa3b2" font-size="17">copyleft after code was copied and LLM-rewritten to hide its origin</text>

  <!-- license change -->
  <g font-size="15">
    <rect x="60" y="150" width="200" height="44" rx="6" fill="none" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="160" y="177" fill="#9aa3b2" text-anchor="middle" font-weight="700">MIT (permissive)</text>

    <text x="300" y="178" fill="#9aa3b2" text-anchor="middle" font-size="20">→</text>
    <text x="300" y="214" fill="#9aa3b2" text-anchor="middle" font-size="13">all repos</text>

    <rect x="340" y="150" width="290" height="44" rx="6" fill="#4ec27a"/>
    <text x="485" y="177" fill="#14161b" text-anchor="middle" font-weight="700">GPL-2.0-or-later</text>

    <text x="660" y="168" fill="#4ec27a">no closed forks</text>
    <text x="660" y="190" fill="#4ec27a">changes come back</text>
  </g>

  <g font-size="16">
    <text x="60" y="270" fill="#9aa3b2">can't fix</text>
    <text x="180" y="270" fill="#febc2e">code already out under MIT · proving LLM rewrites</text>
    <text x="60" y="304" fill="#9aa3b2">also</text>
    <text x="180" y="304" fill="#ffffff">M3 support out of EXPERT mode · GPU still WIP</text>
  </g>

  <!-- copyleft icon -->
  <g transform="translate(866 44)" fill="none" stroke="#4ec27a" stroke-width="5" stroke-linecap="round">
    <circle cx="34" cy="34" r="28"/>
    <path d="M24 24 A14 14 0 1 1 24 44"/>
  </g>
</svg>
