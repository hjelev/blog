  <text x="78" y="270" font-size="15" xml:space="preserve"><tspan fill="#9aa3b2">.rw-r--r-- </tspan><tspan fill="#4ec27a">  844 </tspan><tspan fill="#9aa3b2">- </tspan><tspan fill="#febc2e">▪ </tspan><tspan fill="#febc2e">Cargo.toml</tspan></text>
  <text x="78" y="296" font-size="15" xml:space="preserve"><tspan fill="#9aa3b2">.rwxr-xr-x </tspan><tspan fill="#4ec27a">  12k </tspan><tspan fill="#febc2e">N </tspan><tspan fill="#4ec27a">▪ </tspan><tspan fill="#4ec27a">build.sh</tspan></text>
