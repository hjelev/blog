<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="Atkinson Hyperlegible Next, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="glow" cx="76%" cy="50%" r="42%">
      <stop offset="0" stop-color="#f25f5c" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f25f5c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#343946"/>
    </pattern>
  </defs>
  <rect width="1000" height="360" rx="14" fill="#14161b"/>
  <rect x="540" y="0" width="460" height="360" fill="url(#grid)" opacity="0.6"/>
  <rect width="1000" height="360" rx="14" fill="url(#glow)"/>

  <text x="60" y="88" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#f25f5c" letter-spacing="2">ANDROID 17 · API 37</text>
  <text x="60" y="146" font-size="44" font-weight="700" fill="#ffffff">Android 17 vs</text>
  <text x="60" y="198" font-size="44" font-weight="700" fill="#ffffff">your homelab</text>
  <text x="60" y="242" font-size="19" fill="#9aa3b2">Why apps time out on 192.168.x.x, and the fix</text>
  <rect x="60" y="274" width="244" height="40" rx="20" fill="#262a33" stroke="#343946"/>
  <text x="82" y="300" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#febc2e">Nearby devices › Allow</text>

  <!-- phone -->
  <g fill="none" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="590" y="100" width="92" height="164" rx="16" stroke="#9aa3b2"/>
    <line x1="622" y1="246" x2="650" y2="246" stroke="#9aa3b2"/>
    <rect x="606" y="122" width="60" height="22" rx="5" stroke="#5b9cf5" stroke-width="3"/>
    <rect x="606" y="154" width="60" height="22" rx="5" stroke="#343946" stroke-width="3"/>
    <rect x="606" y="186" width="60" height="22" rx="5" stroke="#343946" stroke-width="3"/>
  </g>
  <!-- connection, blocked -->
  <path d="M694 182 H758" stroke="#9aa3b2" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>
  <path d="M842 182 H862" stroke="#343946" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>
  <g transform="translate(800 182)">
    <circle r="36" fill="#14161b" stroke="#f25f5c" stroke-width="5"/>
    <line x1="-24" y1="-24" x2="24" y2="24" stroke="#f25f5c" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- server rack -->
  <g fill="none" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="874" y="108" width="88" height="44" rx="8" stroke="#6b7180"/>
    <rect x="874" y="160" width="88" height="44" rx="8" stroke="#6b7180"/>
    <rect x="874" y="212" width="88" height="44" rx="8" stroke="#6b7180"/>
    <line x1="890" y1="130" x2="920" y2="130" stroke="#343946"/>
    <line x1="890" y1="182" x2="920" y2="182" stroke="#343946"/>
    <line x1="890" y1="234" x2="920" y2="234" stroke="#343946"/>
  </g>
  <circle cx="944" cy="130" r="5" fill="#6b7180"/><circle cx="944" cy="182" r="5" fill="#6b7180"/><circle cx="944" cy="234" r="5" fill="#6b7180"/>
  <text x="918" y="290" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#6b7180">192.168.1.10</text>
  <text x="636" y="290" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#9aa3b2">targetSdk 37</text>
</svg>
