<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="Atkinson Hyperlegible Next, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="16">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6b7180"/></marker></defs>
  <rect width="1000" height="480" rx="14" fill="#14161b"/>
  <text x="40" y="50" font-size="22" font-weight="700" fill="#ffffff">App can't reach your server on Android 17?</text>

  <g text-anchor="middle">
    <rect x="270" y="80" width="460" height="60" rx="30" fill="#262a33" stroke="#5b9cf5" stroke-width="2"/>
    <text x="500" y="106" fill="#ffffff" font-weight="700">Does the app list "Nearby devices"</text>
    <text x="500" y="128" fill="#ffffff" font-weight="700">under its permissions?</text>

    <rect x="580" y="196" width="380" height="84" rx="10" fill="#16291f" stroke="#4ec27a" stroke-width="2"/>
    <text x="770" y="228" fill="#4ec27a" font-weight="700">Allow it, then force-stop the app</text>
    <text x="770" y="254" fill="#9aa3b2" font-size="14" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Settings › Apps › [app] › Permissions</text>

    <rect x="40" y="196" width="440" height="84" rx="10" fill="#2a1a1c" stroke="#f25f5c" stroke-width="2"/>
    <text x="260" y="228" fill="#ffffff" font-weight="700">The app doesn't request it yet</text>
    <text x="260" y="254" fill="#9aa3b2" font-size="14">No switch to flip. Report it, and meanwhile:</text>

    <rect x="40" y="346" width="290" height="96" rx="10" fill="#1d2027" stroke="#343946" stroke-width="1.5"/>
    <text x="185" y="380" fill="#ffffff" font-weight="700">Older build</text>
    <text x="185" y="404" fill="#9aa3b2" font-size="14">one that targets SDK 36</text>
    <text x="185" y="426" fill="#f0883e" font-size="14">temporary, turn off updates</text>

    <rect x="355" y="346" width="290" height="96" rx="10" fill="#1d2027" stroke="#343946" stroke-width="1.5"/>
    <text x="500" y="380" fill="#ffffff" font-weight="700">VPN address</text>
    <text x="500" y="404" fill="#9aa3b2" font-size="14">WireGuard / Tailscale IP</text>
    <text x="500" y="426" fill="#9aa3b2" font-size="14">keep the VPN on at home</text>

    <rect x="670" y="346" width="290" height="96" rx="10" fill="#1d2027" stroke="#343946" stroke-width="1.5"/>
    <text x="815" y="380" fill="#ffffff" font-weight="700">Public DNS name</text>
    <text x="815" y="404" fill="#9aa3b2" font-size="14">resolving to your public IP</text>
    <text x="815" y="426" fill="#9aa3b2" font-size="14">needs hairpin NAT</text>
  </g>
  <g stroke="#6b7180" stroke-width="2" fill="none" marker-end="url(#arr)">
    <path d="M610 140 L720 192"/>
    <path d="M390 140 L300 192"/>
    <path d="M190 280 L185 342"/>
    <path d="M260 280 L480 342"/>
    <path d="M330 280 L780 342"/>
  </g>
  <g font-size="14" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="680" y="160" fill="#4ec27a">yes</text>
    <text x="316" y="160" fill="#f25f5c">no</text>
  </g>
</svg>
