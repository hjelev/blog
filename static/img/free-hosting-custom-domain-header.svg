<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="1000" height="360" rx="14" fill="#14161b"/>

  <text x="60" y="80" fill="#ffffff" font-size="34" font-weight="700">$0 hosting · your domain · no ads</text>
  <text x="60" y="114" fill="#9aa3b2" font-size="17">free static site hosting with HTTPS on a custom domain · 2026</text>

  <g font-size="16">
    <text x="60" y="162" fill="#9aa3b2">$ dig +short CNAME www.example.com</text>
  </g>

  <!-- host rows -->
  <g font-size="16">
    <text x="60"  y="196" fill="#4ec27a" font-weight="700">✓</text><text x="84"  y="196" fill="#ffffff">GitHub Pages</text>
    <text x="330" y="196" fill="#4ec27a" font-weight="700">✓</text><text x="354" y="196" fill="#ffffff">Cloudflare</text>
    <text x="600" y="196" fill="#4ec27a" font-weight="700">✓</text><text x="624" y="196" fill="#ffffff">Codeberg Pages</text>
    <text x="60"  y="226" fill="#4ec27a" font-weight="700">✓</text><text x="84"  y="226" fill="#ffffff">GitLab Pages</text>
    <text x="330" y="226" fill="#febc2e" font-weight="700">~</text><text x="354" y="226" fill="#ffffff">Netlify</text><text x="434" y="226" fill="#9aa3b2">(credits)</text>
    <text x="600" y="226" fill="#febc2e" font-weight="700">~</text><text x="624" y="226" fill="#ffffff">Vercel</text><text x="694" y="226" fill="#9aa3b2">(non-commercial)</text>
  </g>

  <!-- cost bar -->
  <g font-size="13">
    <rect x="60" y="254" width="880" height="12" rx="6" fill="#2a2e37"/>
    <rect x="60" y="254" width="70" height="12" rx="6" fill="#febc2e"/>
    <text x="60" y="286" fill="#febc2e">domain ~$12/yr</text>
    <text x="940" y="286" fill="#4ec27a" text-anchor="end">hosting, HTTPS, CDN: $0</text>
  </g>

  <g font-size="16">
    <text x="60" y="326" fill="#9aa3b2">tip</text>
    <text x="130" y="326" fill="#febc2e">a static site is just files in git: switching hosts takes minutes</text>
  </g>

  <!-- globe + lock icon -->
  <g transform="translate(866 40)" fill="none" stroke="#4ec27a" stroke-width="4" stroke-linecap="round">
    <circle cx="34" cy="34" r="28"/>
    <ellipse cx="34" cy="34" rx="12" ry="28"/>
    <path d="M6 34 H62"/>
  </g>
  <g transform="translate(916 82)">
    <rect x="0" y="12" width="26" height="20" rx="3" fill="#febc2e"/>
    <path d="M6 12 V7 a7 7 0 0 1 14 0 V12" fill="none" stroke="#febc2e" stroke-width="3.5"/>
  </g>
</svg>
