title: blog.masoko.net
description: Notes on Linux, CLI tools, Raspberry Pi and home-lab DIY, written down so I can redo them when they break.
author: Hristo Jelev
logo: /static/img/avatar2.jpg
github: https://github.com/hjelev
social:
  name: Hristo Jelev
  links:
    - https://github.com/hjelev
# Paste the content value of Google Search Console's HTML-tag verification here
# webmaster_verifications:
#   google: XXXXXXXXXXXXXXXX
about: blog.masoko.net
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-gist
  - jekyll-redirect-from
baseurl: ""
url: "https://blog.masoko.net"

allowsearch: true

disqus_shortname: my-blog-notes


enableTags: true
tagarray: []

paginate: 20
per_page: 20
paginate_path: "/page:num/"
markdown: kramdown
permalink: /:categories/:title/

# Default social-preview card (used by jekyll-seo-tag for og:image / twitter:image)
defaults:
  - scope:
      path: ""
    values:
      image: /static/img/og-card.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post
