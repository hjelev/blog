<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
  <rect width="1000" height="560" rx="12" fill="#0d0e11"/>
  <rect width="1000" height="40" rx="12" fill="#22252d"/>
  <rect y="28" width="1000" height="12" fill="#22252d"/>
  <circle cx="24" cy="20" r="7" fill="#ff5f57"/><circle cx="48" cy="20" r="7" fill="#febc2e"/><circle cx="72" cy="20" r="7" fill="#28c840"/>
  <text x="500" y="26" fill="#9aa0ab" font-size="14" text-anchor="middle">~/git/blog — claude</text>

  <!-- prompt -->
  <text x="32" y="84" fill="#d97757">&gt;</text>
  <text x="52" y="84" fill="#e8e8e8">The tag page 404s on mobile. Find out why and fix it.</text>

  <!-- tool calls -->
  <text x="32" y="128" fill="#4ec27a">●</text>
  <text x="52" y="128" fill="#e8e8e8" font-weight="700">Search</text><text x="118" y="128" fill="#9aa0ab">(pattern: "tags", path: "_layouts")</text>
  <text x="52" y="152" fill="#6b7180">  ⎿  Found 3 files</text>

  <text x="32" y="188" fill="#4ec27a">●</text>
  <text x="52" y="188" fill="#e8e8e8" font-weight="700">Read</text><text x="100" y="188" fill="#9aa0ab">(_includes/nav.html)</text>
  <text x="52" y="212" fill="#6b7180">  ⎿  Read 48 lines</text>

  <text x="32" y="248" fill="#e8e8e8">●</text>
  <text x="52" y="248" fill="#e8e8e8">The mobile menu links to /tags but the page lives at /categories/.</text>
  <text x="52" y="272" fill="#e8e8e8">I'll update the link.</text>

  <text x="32" y="308" fill="#4ec27a">●</text>
  <text x="52" y="308" fill="#e8e8e8" font-weight="700">Update</text><text x="118" y="308" fill="#9aa0ab">(_includes/nav.html)</text>
  <rect x="72" y="320" width="880" height="24" fill="#3b1d1f"/>
  <text x="80" y="337" fill="#f08a8a">- &lt;a href="/tags"&gt;Tags&lt;/a&gt;</text>
  <rect x="72" y="344" width="880" height="24" fill="#1b3323"/>
  <text x="80" y="361" fill="#7fd99a">+ &lt;a href="/categories/"&gt;Tags&lt;/a&gt;</text>

  <text x="32" y="400" fill="#4ec27a">●</text>
  <text x="52" y="400" fill="#e8e8e8" font-weight="700">Bash</text><text x="100" y="400" fill="#9aa0ab">(bundle exec jekyll build)</text>
  <text x="52" y="424" fill="#6b7180">  ⎿  done in 1.9 seconds.</text>

  <!-- input box -->
  <rect x="24" y="456" width="952" height="48" rx="8" fill="none" stroke="#3a3f4b"/>
  <text x="44" y="486" fill="#d97757">&gt;</text>
  <rect x="64" y="472" width="10" height="20" fill="#e8e8e8"/>
  <text x="32" y="534" fill="#6b7180" font-size="14">⏵⏵ accept edits on (shift+tab to cycle)</text>
  <text x="968" y="534" fill="#6b7180" font-size="14" text-anchor="end">Opus · ~/git/blog</text>
</svg>
