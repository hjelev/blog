<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ec27a"/>
      <stop offset="1" stop-color="#2a8f8f"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="360" rx="14" fill="#14161b"/>

  <text x="60" y="80" fill="#ffffff" font-size="34" font-weight="700">Let's Encrypt certificate lifetimes</text>
  <text x="60" y="114" fill="#9aa3b2" font-size="17">shorter certs, shorter validation reuse: automate or break</text>

  <!-- 90 days -->
  <g font-size="16">
    <text x="60" y="172" fill="#9aa3b2">today</text>
    <rect x="200" y="152" width="720" height="30" rx="6" fill="#2a2d36"/>
    <rect x="200" y="152" width="720" height="30" rx="6" fill="#5c9cf5" opacity="0.55"/>
    <text x="900" y="173" fill="#ffffff" font-weight="700" text-anchor="end">90 days</text>

    <!-- 64 days -->
    <text x="60" y="232" fill="#febc2e">Feb 2027</text>
    <rect x="200" y="212" width="720" height="30" rx="6" fill="#2a2d36"/>
    <rect x="200" y="212" width="512" height="30" rx="6" fill="url(#bar)"/>
    <text x="692" y="233" fill="#ffffff" font-weight="700" text-anchor="end">64 days</text>

    <!-- 45 days -->
    <text x="60" y="292" fill="#ff7a59">2028</text>
    <rect x="200" y="272" width="720" height="30" rx="6" fill="#2a2d36"/>
    <rect x="200" y="272" width="360" height="30" rx="6" fill="#ff7a59" opacity="0.8"/>
    <text x="540" y="293" fill="#ffffff" font-weight="700" text-anchor="end">45 days</text>
  </g>

  <!-- lock icon -->
  <g transform="translate(870 52)">
    <path d="M14 30 v-12 a16 16 0 0 1 32 0 v12" fill="none" stroke="#4ec27a" stroke-width="6"/>
    <rect x="4" y="30" width="52" height="40" rx="7" fill="#4ec27a"/>
    <circle cx="30" cy="48" r="5" fill="#14161b"/>
    <rect x="27.5" y="50" width="5" height="11" rx="2" fill="#14161b"/>
  </g>
</svg>
