  <text x="108" y="318" fill="#4ec27a" font-size="12" text-anchor="start">dns.adguard-dns.com</text>
  <text x="360" y="180" fill="#ffffff" font-size="17" text-anchor="start" font-weight="700">Settings → Network &amp; internet → Private DNS</text>
  <rect x="360" y="205" width="580" height="38" rx="8" fill="#2a2d36"/>
