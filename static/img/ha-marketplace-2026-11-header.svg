<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="1000" height="360" rx="14" fill="#14161b"/>

  <text x="60" y="80" fill="#ffffff" font-size="34" font-weight="700">HACS → Marketplace</text>
  <text x="60" y="114" fill="#9aa3b2" font-size="17">Home Assistant 2026.11 builds the community store into core</text>

  <!-- migration -->
  <g font-size="15">
    <rect x="60" y="150" width="200" height="44" rx="6" fill="none" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="160" y="177" fill="#9aa3b2" text-anchor="middle" font-weight="700">HACS (removed)</text>

    <text x="300" y="178" fill="#9aa3b2" text-anchor="middle" font-size="20">→</text>
    <text x="300" y="214" fill="#9aa3b2" text-anchor="middle" font-size="13">auto-migrated</text>

    <rect x="340" y="150" width="290" height="44" rx="6" fill="#18bcf2"/>
    <text x="485" y="177" fill="#14161b" text-anchor="middle" font-weight="700">Settings → Marketplace</text>

    <text x="660" y="168" fill="#4ec27a">integrations · cards</text>
    <text x="660" y="190" fill="#4ec27a">themes · templates</text>
  </g>

  <g font-size="16">
    <text x="60" y="270" fill="#9aa3b2">check</text>
    <text x="180" y="270" fill="#ffffff">backup first · hacs.json in custom repos</text>
    <text x="60" y="304" fill="#9aa3b2">no updates</text>
    <text x="180" y="304" fill="#febc2e">repos without hacs.json · AppDaemon · python_scripts</text>
  </g>

  <!-- house icon -->
  <g transform="translate(866 44)" fill="none" stroke="#18bcf2" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M6 30 L34 6 L62 30 V62 H6 Z"/>
    <circle cx="34" cy="40" r="6"/>
  </g>
</svg>
