<text x="40" y="52" font-family="Atkinson Hyperlegible Next, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#ffffff" font-weight="700" >Which half goes where</text><text x="40" y="80" font-family="Atkinson Hyperlegible Next, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9aa3b2" >The private key never leaves your machine</text><rect x="40" y="110" width="400" height="200" rx="12" fill="#1d2027" stroke="#343946" stroke-width="1.5"/><g transform="translate(64 130) scale(0.6000)" fill="none" stroke="#9aa3b2" stroke-width="6.67" stroke-linejoin="round" stroke-linecap="round"><rect x="18" y="20" width="64" height="44" rx="5"/><path d="M6 76 H94 L86 64 H14 Z"/></g><text x="140" y="162" font-family="Atkinson Hyperlegible Next, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="700" >Your laptop</text><text x="64" y="216" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#f25f5c" >~/.ssh/id_ed25519</text><text x="64" y="240" font-family="Atkinson Hyperlegible Next, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9aa3b2" >private: keep secret</text><text x="64" y="276" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#4ec27a" >~/.ssh/id_ed25519.pub</text><rect x="560" y="110" width="400" height="200" rx="12" fill="#1d2027" stroke="#343946" stroke-width="1.5"/><g transform="translate(584 130) scale(0.6000)" fill="none" stroke="#9aa3b2" stroke-width="6.67" stroke-linejoin="round" stroke-linecap="round"><rect x="12" y="8" width="76" height="24" rx="5"/><rect x="12" y="38" width="76" height="24" rx="5"/><rect x="12" y="68" width="76" height="24" rx="5"/><line x1="24" y1="20" x2="48" y2="20"/><line x1="24" y1="50" x2="48" y2="50"/><line x1="24" y1="80" x2="48" y2="80"/><circle cx="74" cy="20" r="2.5" fill="#4ec27a" stroke="none"/><circle cx="74" cy="50" r="2.5" fill="#4ec27a" stroke="none"/><circle cx="74" cy="80" r="2.5" fill="#4ec27a" stroke="none"/></g><text x="660" y="162" font-family="Atkinson Hyperlegible Next, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#ffffff" font-weight="700" >Server</text><text x="584" y="216" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#4ec27a" >~/.ssh/authorized_keys</text><text x="584" y="240" font-family="Atkinson Hyperlegible Next, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#9aa3b2" >one line per allowed key</text><text x="584" y="276" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#febc2e" >PasswordAuthentication no</text><path d="M300 272 C 440 272, 440 224, 576 224" stroke="#4ec27a" stroke-width="2" fill="none" marker-end="url(#m4ec27a)"/><text x="500" y="206" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#4ec27a" text-anchor="middle" >ssh-copy-id</text>
