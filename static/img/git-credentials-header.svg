<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect width="1000" height="360" rx="14" fill="#14161b"/>
  <text x="60" y="80" fill="#ffffff" font-size="34" font-weight="700">Make Git remember your token</text>
  <text x="60" y="114" fill="#9aa3b2" font-size="17">stop pasting a GitHub token on every push</text>
  <rect x="60" y="140" width="430" height="196" rx="10" fill="#1d2027"/>
  <rect x="60" y="140" width="430" height="26" rx="10" fill="#2a2d36"/>
  <rect x="60" y="156" width="430" height="10" rx="0" fill="#2a2d36"/>
  <circle cx="78" cy="153" r="5" fill="#ff5f57"/>
  <circle cx="96" cy="153" r="5" fill="#febc2e"/>
  <circle cx="114" cy="153" r="5" fill="#28c840"/>
  <text x="78" y="192" font-size="14" xml:space="preserve"><tspan fill="#4ec27a">$ </tspan><tspan fill="#ffffff">git push</tspan></text>
  <text x="78" y="218" font-size="14" xml:space="preserve"><tspan fill="#9aa3b2">Username for 'https://github.com':</tspan></text>
  <text x="78" y="244" font-size="14" xml:space="preserve"><tspan fill="#9aa3b2">Password for 'https://you@github.com':</tspan></text>
  <text x="78" y="270" font-size="14" xml:space="preserve"><tspan fill="#ffffff"></tspan></text>
  <text x="78" y="296" font-size="14" xml:space="preserve"><tspan fill="#ff5f57"># again. and again. and again.</tspan></text>
  <line x1="500" y1="238" x2="540" y2="238" stroke="#4ec27a" stroke-width="2.5"/>
  <path d="M540.0 238.0 L531.0 242.3 L531.0 233.7 Z" fill="#4ec27a"/>
  <rect x="560" y="140" width="380" height="58" rx="8" fill="#2a2d36"/>
  <rect x="560" y="140" width="5" height="58" rx="2" fill="#ff7a59"/>
  <text x="582" y="165" fill="#ffffff" font-size="16" text-anchor="start" font-weight="700">1  token in URL</text>
  <text x="582" y="186" fill="#9aa3b2" font-size="14" text-anchor="start">git remote set-url origin …</text>
  <rect x="560" y="208" width="380" height="58" rx="8" fill="#2a2d36"/>
  <rect x="560" y="208" width="5" height="58" rx="2" fill="#febc2e"/>
  <text x="582" y="233" fill="#ffffff" font-size="16" text-anchor="start" font-weight="700">2  credential helper</text>
  <text x="582" y="254" fill="#9aa3b2" font-size="14" text-anchor="start">credential.helper store</text>
  <rect x="560" y="276" width="380" height="58" rx="8" fill="#2a2d36"/>
  <rect x="560" y="276" width="5" height="58" rx="2" fill="#4ec27a"/>
  <text x="582" y="301" fill="#ffffff" font-size="16" text-anchor="start" font-weight="700">3  GitHub CLI</text>
  <text x="582" y="322" fill="#9aa3b2" font-size="14" text-anchor="start">gh auth setup-git</text>

</svg>
